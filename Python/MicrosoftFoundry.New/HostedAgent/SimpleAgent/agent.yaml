# Agent definition for Azure Developer CLI (azd) deployment
name: simple-agent
description: A simple conversational agent for demonstration purposes

# Container configuration
container:
  dockerfile: Dockerfile
  context: .

# Resource allocation
resources:
  cpu: "1"
  memory: "2Gi"

# Environment variables (set during deployment)
environment:
  FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
  AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
